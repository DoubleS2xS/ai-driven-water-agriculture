# Default configuration for the AIoT precision-agriculture pipeline.
# All values here mirror dataclass defaults in src/config.py.
# Override individual fields as needed.

data_loader:
  mendeley_dir: >-
    Smart irrigation control system data with soil moisture, flow meter
    and electrovalve relay
  raw_cache_dir: data/raw
  processed_dir: data/processed
  resample_freq: "1h"
  use_cache: false
  # Wall clock of the Mendeley sensor loggers: local = UTC + offset.
  # Paraguay = UTC-04:00 (PYT) for the whole 2022-07-12 → 2022-09-16
  # window; PYST (UTC-03:00) runs Oct → Mar and does not apply.
  # Local timestamps are therefore converted to UTC by adding 4 hours.
  mendeley_utc_offset_hours: -4.0
  # Half-width (hours) of the acceptance window for the post-merge
  # solar-radiation diurnal check. Expected peak hour is derived from
  # mendeley_utc_offset_hours, not hard-coded (-> 16:00 UTC).
  # 2 h, because a clock-derived expectation never matches solar geometry
  # exactly: Areguá is 2.6° west of the 60°W zone meridian, so true solar
  # noon is 15.83 UTC (bin 15), plus ±0.5 h of hourly binning. Still far
  # tighter than the errors it catches (Karaganda peaked at 07:00 UTC;
  # a Local-Solar-Time response peaks at 12:00).
  solar_peak_tolerance_hours: 2.0
  nasa_power:
    # Areguá, Central Department, Paraguay — the strawberry-producing
    # district where the Mendeley dataset was recorded.
    latitude: -25.31
    longitude: -57.39
    site_name: "Areguá, Central Department, Paraguay"
    country: Paraguay
    crop: strawberry
    parameters:
      - T2M
      - RH2M
      - WS2M
      - ALLSKY_SFC_SW_DWN
    community: AG
    temporal: hourly
    base_url: https://power.larc.nasa.gov/api/temporal
    time_standard: UTC

corruption:
  missing:
    rate: 0.10
    mechanism: mcar        # "mcar" | "heat_dependent"
    seed: 42
    heat_midpoint_c: 35.0  # °C — logistic midpoint
    heat_steepness: 0.3    # logistic steepness k

  drift:
    a: 5.545                 # asymptotic max drift (%)
    b: 0.08                # exponential rate (1/h)
    recalibration_interval_hours: [35, 40]
    ec_factor: null         # set to e.g. 0.1 to enable EC distortion
    ec_moisture_coeff: 0.005
    ec_salt_concentration: 2.0  # dS/m — Soil Systems 2025
    seed: 42
