datasets:
- name: Smart Irrigation Control System Data
  source: Mendeley Data
  doi: 10.17632/cjb4vy4mzj.3
  url: https://data.mendeley.com/datasets/cjb4vy4mzj/3
  license: CC BY 4.0
  accessed: '2026-08-15'
  files:
  - D_moisture.txt
  - D_valve.txt
  - D_flowmeter.txt
  date_range: 2022-07-12 to 2022-09-16 (local time)
  site: Areguá, Central Department, Paraguay
  country: Paraguay
  crop: strawberry
  native_timezone: UTC-4 (PYT, Paraguay standard time)
  utc_conversion: Timestamps are local wall-clock readings and are shifted by +4 h
    to UTC before merging with NASA POWER. Paraguayan DST (PYST, UTC-03:00) runs from
    the first Sunday of October to the fourth Sunday of March and therefore does not
    overlap the 2022-07-12 → 2022-09-16 observation window; a single constant offset
    is exact for this dataset.
  notes: Soil moisture, electrovalve relay status, cumulative flow meter data.
- name: NASA POWER Hourly Meteorological Data
  source: NASA Langley POWER Project (MERRA-2 reanalysis)
  url: https://power.larc.nasa.gov/api/temporal/hourly/point
  license: Public domain (NASA Open Data Policy)
  accessed: '2026-08-15'
  parameters:
  - T2M
  - RH2M
  - WS2M
  - ALLSKY_SFC_SW_DWN
  coordinates:
    lat: -25.31
    lon: -57.39
  site: Areguá, Central Department, Paraguay
  country: Paraguay
  date_range: 2022-07-12 to 2022-09-17 (UTC)
  date_shift_applied: false
  time_standard: UTC
  notes: Coordinates are the sensor deployment site itself (Areguá, Central Department,
    Paraguay), not a different region. NASA POWER MERRA-2 reanalysis covers the exact
    Mendeley observation period. No calendar-date shift was necessary; only the local→UTC
    clock conversion described under the Mendeley entry. The API is called with time-standard=UTC
    to avoid silent misalignment with Mendeley sensor clock-times (the POWER Hourly
    API defaults to Local Solar Time).
output_conventions:
  timestamp_column:
    timezone: UTC
    mendeley_utc_offset_hours: -4.0
    note: 'All timestamps in the final merged DataFrame are in UTC. Mendeley sensor
      timestamps are local Paraguayan wall-clock time (UTC-4) and are shifted by +4
      h before the merge; NASA POWER is explicitly requested in UTC via time-standard=UTC.
      The reconciliation is verified automatically after every merge: the mean diurnal
      cycle of solar_radiation must peak at 16:00 UTC ± 2 h, otherwise the loader
      raises.'
  flow_l: Differential (per-period) volume computed from the cumulative flow-meter
    readings.
  flow_l_cumulative: Raw cumulative readings preserved from D_flowmeter.txt.
  solar_radiation:
    unit: W/m²
    native_unit: MJ/m²/hr (NASA POWER ALLSKY_SFC_SW_DWN)
    conversion: multiplied by 277.78 (1 MJ/hr = 10⁶ J / 3600 s ≈ 277.78 W)
    note: The NASA POWER Hourly API returns ALLSKY_SFC_SW_DWN in MJ/m²/hr. Values
      are converted to W/m² during merge for consistency with standard SI irradiance
      units.
assumptions:
- id: A1
  description: 'Meteorological covariates are NASA POWER MERRA-2 reanalysis for (-25.31,
    -57.39) — Areguá, Central Department, Paraguay — i.e. a gridded regional proxy
    for the SAME region and the SAME season as the Mendeley sensor deployment, not
    in-situ measurements at the field. The residual limitation is spatial: MERRA-2
    resolves roughly 0.5° × 0.625°, so sub-grid microclimate (canopy shading, local
    advection, irrigation-induced humidity) is not represented. Earlier revisions
    of this pipeline requested weather for Karaganda, Kazakhstan (49.80, 73.10) —
    a different continent and the opposite hemisphere''s season. Those features were
    uncorrelated with the target by construction and any result derived from them
    is void.'
- id: A2
  description: Mendeley timestamps are treated as local Paraguayan wall-clock time
    (UTC-4) and converted to UTC with a single constant offset. This is exact for
    the 2022-07-12 → 2022-09-16 window because Paraguayan DST does not overlap it.
    The dataset documentation does not state the logger timezone explicitly; the assumption
    is verified indirectly by the post-merge diurnal alignment check on solar_radiation.
- id: A3
  description: ec_salt_concentration defaults to 2.0 dS/m, a documented approximation
    only. The cited source (Soil Systems, 2025, doi:10.3390/soilsystems9020057) reports
    the secondary salinization threshold for irrigated Haplic Kastanozem soils of
    the Kazakhstan steppe — a soil and climate unrelated to the Paraguayan site. It
    is retained solely as an order-of-magnitude parameter for the synthetic drift-injection
    experiment (src/robustness_experiment.py) and must NOT be read as a calibrated
    property of this field. The ec_factor mapping (EC ≈ f(soil_moisture, salt_concentration))
    is likewise not a validated physical model. See Review §2.3.1, sources [3, 4].
